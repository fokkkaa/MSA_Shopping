name: msa-shopping

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-shopping-root-local}
      MYSQL_DATABASE: shopping_db
      MYSQL_USER: shopping
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-shopping-local}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3308}:3306"
    volumes:
      - shopping_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u"$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  app:
    image: msa-shopping:local
    build:
      context: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      FLYWAY_BASELINE_ON_MIGRATE: ${FLYWAY_BASELINE_ON_MIGRATE:-false}
      DB_URL: jdbc:mysql://mysql:3306/shopping_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      DB_USERNAME: shopping
      DB_PASSWORD: ${MYSQL_PASSWORD:-shopping-local}
    ports:
      - "127.0.0.1:${APP_PORT:-8082}:8080"

volumes:
  shopping_data:
