# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:shoppingdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=admin

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# H2 Console (веб-интерфейс для просмотра БД)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Flyway owns the schema; Hibernate only validates entity mappings.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/structure,classpath:db/migration/data
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1
spring.flyway.clean-disabled=true
