# Persistent MySQL storage managed by Flyway.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3308/shopping_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:shopping}
spring.datasource.password=${DB_PASSWORD:shopping-local}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
